version: "2.3"

services:
  finetune:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    volumes:
      - .:/Finetune
      - ../project_fruitfly/datasets:/datasets
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

