version: "2.3"

services:
  finetune:
#    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
#    image: finetune-profiling:latest
    environment:
      LD_LIBRARY_PATH: /opt/cupti/CUPTI/lib64
    volumes:
      - .:/Finetune
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
